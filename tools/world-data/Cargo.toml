[package]
name = "world-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Validation tooling for WorldHunt geographic source data"
license = "MIT"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
toml = "0.8.20"
terminal_size = "0.4.2"
unicode-normalization = "0.1.24"
flate2 = "1.1.2"
prost = "0.14.1"
geo = "0.33.1"
geographiclib-rs = "0.2.7"
rstar = "0.13.0"
