version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "[Dependency Update]"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "[CI Update]"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: dtolnay/rust-toolchain
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
