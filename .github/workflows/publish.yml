name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  select-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select and validate the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          version="${tag#v}"
          test "$tag" = "v$version"
          git fetch --tags --force
          git rev-parse "$tag^{commit}" >/dev/null
          git merge-base --is-ancestor "$tag^{commit}" HEAD
          tag_version="$(git show "$tag:Cargo.toml" | sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' | head -n 1)"
          test "$tag_version" = "$version"
          status="$(curl --silent --output /tmp/crate.json --write-out '%{http_code}' "https://crates.io/api/v1/crates/worldhunt/$version")"
          test "$status" = "404"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: select-release
    runs-on: ubuntu-latest
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select-release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - name: Validate tagged release candidate
        run: make release-check-clean
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish WorldHunt
        run: cargo publish --locked -p worldhunt --token "${{ steps.crates-io-auth.outputs.token }}"
