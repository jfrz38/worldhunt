name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  select-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version-check.outputs.local-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select and validate the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          version="${tag#v}"
          test "$tag" = "v$version"
          git fetch --tags --force
          git rev-parse "$tag^{commit}" >/dev/null
          git merge-base --is-ancestor "$tag^{commit}" HEAD
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check out selected release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
      - name: Check version can be published
        id: version-check
        uses: jfrz38/check-version-change@c087b716b54ed45079f2440924db036f636539b3 # v1.3.1
        with:
          file-path: Cargo.toml
          package-name: worldhunt
          compare-source: registry
          registry: crates-io
          fail-on-unchanged: true
          fail-on-not-higher: true
      - name: Verify selected tag matches package version
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version-check.outputs.local-version }}
        shell: bash
        run: test "$TAG" = "v$VERSION"

  publish:
    needs: select-release
    runs-on: ubuntu-latest
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select-release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - name: Validate tagged release candidate
        run: make release-check-clean
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish WorldHunt
        run: cargo publish --locked -p worldhunt --token "${{ steps.crates-io-auth.outputs.token }}"
