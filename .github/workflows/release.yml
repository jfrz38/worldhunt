name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - name: Validate release candidate
        run: make release-check-clean
      - name: Read candidate version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether the version changed
        id: changed
        if: github.event_name == 'push'
        shell: bash
        run: |
          previous_version="$(git show HEAD^:Cargo.toml 2>/dev/null | sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' | head -n 1 || true)"
          if [ "$previous_version" = "${{ steps.version.outputs.value }}" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create immutable tag and GitHub Release
        if: github.event_name == 'push' && steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        shell: bash
        run: |
          tag_commit="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
          head_commit="$(git rev-parse HEAD)"
          if [ -n "$tag_commit" ]; then
            test "$tag_commit" = "$head_commit"
          else
            git tag -a "$TAG" -m "WorldHunt $TAG"
            git push origin "$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "WorldHunt $TAG" --generate-notes
