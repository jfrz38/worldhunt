[package]
name = "worldhunt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A hot-and-cold geography guessing game for the terminal"
license = "MIT"
repository = "https://github.com/jfrz38/worldhunt"
readme = "README.md"
keywords = ["game", "geography", "terminal", "tui", "countries"]
categories = ["command-line-utilities", "games"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "src/**",
    "assets/world-v2.bin",
    "assets/map-details-v1.bin",
    "assets/country-map-v1/**",
    "data/countries.toml",
    "data/source/world-boundaries.metadata.toml",
    "data/source/world-details.metadata.toml",
    "data/source/openstreetmap/**",
]

[workspace]
members = [".", "tools/world-data"]
resolver = "3"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
flate2 = "1.1.2"
prost = "0.14.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rand = { version = "0.9.2", features = ["std_rng"] }
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.8.20"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
