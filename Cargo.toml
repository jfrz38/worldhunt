[package]
name = "worldhunt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A hot-and-cold geography guessing game for the terminal"
license = "MIT"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
